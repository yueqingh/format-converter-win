name: build-windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force -Path ffmpeg_dist | Out-Null
          Copy-Item $ff.FullName ffmpeg_dist\
          Copy-Item (Join-Path $ff.DirectoryName "ffprobe.exe") ffmpeg_dist\
          $lic = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName ffmpeg_dist\FFMPEG-LICENSE.txt }
          Get-ChildItem ffmpeg_dist

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --name FormatConverter --icon app.ico
          --collect-all customtkinter --collect-all tkinterdnd2
          --hidden-import ui --hidden-import ui_widgets --hidden-import selftest
          --add-data "app.ico;." main.py

      - name: Assemble package
        shell: pwsh
        run: |
          $d = "dist\FormatConverter"
          New-Item -ItemType Directory -Force -Path "$d\ffmpeg" | Out-Null
          Copy-Item ffmpeg_dist\* "$d\ffmpeg\"
          Copy-Item NOTICE.txt, README.txt $d
          Copy-Item app.ico $d

      - name: Self test on Windows
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "dist\FormatConverter\FormatConverter.exe" -ArgumentList "--selftest" -Wait -PassThru
          "exit code: $($p.ExitCode)"
          $r = "dist\FormatConverter\data\selftest_result.txt"
          if (Test-Path $r) { Get-Content $r -Encoding UTF8; Copy-Item $r selftest_result.txt } else { "no result file was written" }
          exit $p.ExitCode

      - name: Clean test data
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist\FormatConverter\data) { Remove-Item -Recurse -Force dist\FormatConverter\data }

      - name: Zip
        shell: pwsh
        run: |
          $m = Select-String -Path diag.py -Pattern 'APP_VERSION = "([0-9.]+)"'
          $ver = $m.Matches[0].Groups[1].Value
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Compress-Archive -Path dist\FormatConverter -DestinationPath "FormatConverter-v$ver-win64.zip"
          Get-ChildItem *.zip | Select-Object Name, Length

      - name: Upload artifact (backup download)
        uses: actions/upload-artifact@v4
        with:
          name: FormatConverter-win64
          path: FormatConverter-v*-win64.zip
          retention-days: 14

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("FormatConverter-v$env:VERSION-win64.zip")
          if (Test-Path selftest_result.txt) { $files += "selftest_result.txt" }
          try { gh release delete latest --yes --cleanup-tag } catch { "no previous release" }
          gh release create latest @files --title "FormatConverter v$env:VERSION" --notes "Windows 10/11 64-bit. Download the zip, unzip it, double-click FormatConverter.exe." --target ${{ github.sha }}
